toolchains:
  default: system
fileGroups:
  sources:
    - go.mod
    - go.sum
    - ./**/*.go
tasks:
  mod-download:
    inputs:
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      go mod download
    options:
      cache: true
  test:
    deps:
      - ~:mod-download
    inputs:
      - ./*.go
      - ./**/*.go
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      go test -count=1 . ./cmd/...
    options:
      cache: true
  test-e2e:
    deps:
      - ~:mod-download
    inputs:
      - ./*.go
      - ./**/*.go
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      go test -count=1 -timeout=30s ./e2e
    options:
      cache: true
  lint:
    deps:
      - ~:mod-download
    inputs:
      - ./*.go
      - ./**/*.go
      - go.mod
      - go.sum
      - .golangci.yaml
    script: |-
      set -euo pipefail
      if [[ "${CI:-}" == "true" ]]; then
        test -z "$(gofmt -l .)"
      else
        gofmt -w .
      fi
      go vet ./...
      go tool golangci-lint run --allow-parallel-runners ./...
    options:
      cache: true
  check:
    deps:
      - ~:lint
      - ~:test
      - ~:test-e2e
    inputs: []
    options:
      runInCI: false
