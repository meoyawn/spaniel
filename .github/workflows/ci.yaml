name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go modules, compiler, and linter caches
        id: go-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            .cache/golangci-lint
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: "2.5.5"
      - run: mkdir -p "$HOME/.cache/go-build"
      - name: Check affected tasks
        id: ci
        run: moon ci
      - name: Report Moon CI results
        if: "!cancelled() && steps.ci.outcome != 'skipped'"
        uses: moonrepo/run-report-action@v1
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
          skip-comment: true
      - name: Upload Moon reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moon-reports-${{ github.run_attempt }}
          path: |
            .moon/cache/ciReport.json
            .moon/cache/runReport.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
